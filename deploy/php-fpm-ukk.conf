; Pool PHP-FPM khusus web siswa.
;
; MASALAH YANG DIPECAHKAN
; Web siswa semula memakai pool bersama yang tidak punya open_basedir. Akibatnya
; satu baris PHP di project siswa bisa membaca berkas mana pun yang terjangkau
; user www -- termasuk config/env.php milik panel, yang memuat password root
; MySQL. Sudah diuji dan memang terbaca.
;
; Pool terpisah ini mengurung PHP siswa di dalam folder projects saja. Situs
; lain di server (termasuk situs sekolah) tetap memakai pool bawaan dan tidak
; terpengaruh sama sekali.
;
; CARA PASANG
;   1. Salin ke: /www/server/php/82/etc/php-fpm.d/ukk.conf
;   2. Uji     : /www/server/php/82/sbin/php-fpm --test -y /www/server/php/82/etc/php-fpm.conf
;   3. Muat ulang: systemctl reload php-fpm-82   (atau restart bila reload tidak didukung)
;   4. Ubah SetHandler di vhost wildcard agar menunjuk socket baru:
;        proxy:unix:/tmp/php-cgi-82-ukk.sock|fcgi://localhost
;   5. /www/server/apache/bin/httpd -t && /www/server/apache/bin/apachectl graceful
;
; Sesuaikan path bila folder panel berbeda.

[ukk]
listen = /tmp/php-cgi-82-ukk.sock
listen.owner = www
listen.group = www
listen.mode = 0660

user = www
group = www

pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
pm.max_requests = 500

; Inti dari pool ini. php_admin_value TIDAK BISA ditimpa oleh ini_set() maupun
; .user.ini dari dalam project, berbeda dengan php_value biasa -- jadi siswa
; tidak bisa melepaskan diri dari batas ini lewat kodenya sendiri.
;
; Cakupannya folder projects, bukan per-project, karena VirtualDocumentRoot
; menentukan folder secara dinamis sehingga tidak bisa disebut satu per satu.
; Konsekuensinya siswa masih bisa membaca berkas project siswa lain; yang
; dicegah di sini adalah kebocoran ke luar, terutama kredensial panel.
php_admin_value[open_basedir] = /www/wwwroot/cpanel.sakuci.id/projects/:/tmp/:/usr/share/php/

; Galat tidak boleh tampil ke pengunjung, tetapi tetap dicatat agar siswa
; bisa dibantu saat kodenya bermasalah.
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /www/wwwlogs/ukk-php-error.log

; Fungsi eksekusi shell dimatikan seperti pool bawaan aaPanel: tanpa ini,
; open_basedir tidak ada artinya karena exec() tidak tunduk padanya.
php_admin_value[disable_functions] = passthru,exec,system,shell_exec,popen,proc_open,pcntl_exec,popepassthru

; Batas wajar agar satu project bermasalah tidak menghabiskan server.
php_admin_value[max_execution_time] = 60
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 16M
