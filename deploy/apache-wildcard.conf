# Subdomain otomatis untuk web siswa.
#
# Dipasang SEKALI. Setelah itu setiap project yang di-clone panel langsung
# punya alamatnya sendiri tanpa konfigurasi tambahan:
#
#     projects/budi/public   ->  http://budi.uk.sakuci.id
#     projects/siti/public   ->  http://siti.uk.sakuci.id
#
# Cara pasang:
#   1. Tambahkan record DNS wildcard:  *.uk.sakuci.id  A  <IP server>
#   2. Salin berkas ini ke server, misalnya:
#        /www/server/panel/vhost/apache/000-wildcard-uk.conf
#   3. Pastikan modul ini aktif di httpd.conf:
#        LoadModule vhost_alias_module modules/mod_vhost_alias.so
#        LoadModule rewrite_module    modules/mod_rewrite.so
#   4. Uji lalu muat ulang:
#        /www/server/apache/bin/httpd -t && systemctl reload httpd
#
# Ganti "uk.sakuci.id" dan path bila berbeda.

<VirtualHost *:80>
    ServerName uk.sakuci.id
    ServerAlias *.uk.sakuci.id

    # %1 adalah bagian pertama nama host: budi.uk.sakuci.id -> "budi".
    # DocumentRoot menunjuk langsung ke public/ milik project, sehingga
    # core/, config/, dan .env berada di luar jangkauan browser.
    VirtualDocumentRoot "/www/wwwroot/cpanel.sakuci.id/projects/%1/public"

    DirectoryIndex index.php index.html

    # Tanpa blok ini Apache mengirimkan berkas .php apa adanya sebagai teks:
    # aplikasi tidak berjalan dan source-nya terbaca pengunjung.
    #
    # Socket yang dipakai adalah pool "ukk" (deploy/php-fpm-ukk.conf), BUKAN
    # pool bawaan. Pool itu memasang open_basedir sehingga PHP siswa tidak
    # bisa membaca berkas di luar folder projects -- termasuk config/env.php
    # panel yang memuat password root MySQL.
    #
    # Bila pool ukk belum dipasang, sementara bisa memakai
    # /tmp/php-cgi-82.sock, tetapi web siswa akan berjalan TANPA pembatasan.
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/tmp/php-cgi-82-ukk.sock|fcgi://localhost"
    </FilesMatch>

    <Directory "/www/wwwroot/cpanel.sakuci.id/projects">
        Options -Indexes +FollowSymLinks

        # Framework siswa mengandalkan .htaccess untuk routing.
        AllowOverride All

        # Menimpa "Require all denied" pada projects/.htaccess. Aturan itu
        # sengaja ada supaya folder project tidak bisa diakses lewat domain
        # panel; di sini justru sebaliknya, memang harus tersaji.
        Require all granted
    </Directory>

    ErrorLog  /www/wwwlogs/uk-wildcard-error.log
    CustomLog /www/wwwlogs/uk-wildcard-access.log combined
</VirtualHost>
