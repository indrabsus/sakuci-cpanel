# Subdomain otomatis untuk web pengguna barcode (*.barcode.sakuci.id).
#
# Mendukung project koding dari 0 (root index.php) maupun Sakuci Framework (public/index.php).
# Otomatis me-route ke folder public/ jika direktori public/ ada.
#
# Cara pasang:
#   1. Pastikan DNS record A untuk *.barcode.sakuci.id mengarah ke IP server.
#   2. Salin ke server: /www/server/panel/vhost/apache/001-wildcard-barcode.conf
#   3. Uji konfigurasi lalu muat ulang:
#        sudo /www/server/apache/bin/httpd -t && sudo /etc/init.d/httpd reload

<VirtualHost *:80>
    ServerName barcode.sakuci.id
    ServerAlias *.barcode.sakuci.id

    VirtualDocumentRoot "/www/wwwroot/cpanel.sakuci.id/projects/%1"
    DirectoryIndex index.php index.html

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^([^.]+)\.barcode\.sakuci\.id$ [NC]
    RewriteCond /www/wwwroot/cpanel.sakuci.id/projects/%1/public -d
    RewriteRule ^/(.*)$ /www/wwwroot/cpanel.sakuci.id/projects/%1/public/$1 [L]

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/tmp/php-cgi-82-ukk.sock|fcgi://localhost"
    </FilesMatch>

    <Directory "/www/wwwroot/cpanel.sakuci.id/projects">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /www/wwwlogs/barcode-wildcard-error.log
    CustomLog /www/wwwlogs/barcode-wildcard-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName barcode.sakuci.id
    ServerAlias *.barcode.sakuci.id

    VirtualDocumentRoot "/www/wwwroot/cpanel.sakuci.id/projects/%1"
    DirectoryIndex index.php index.html

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/barcode.sakuci.id/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/barcode.sakuci.id/privkey.pem
    SSLCipherSuite EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5:ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP:+eNULL
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1
    SSLHonorCipherOrder On

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^([^.]+)\.barcode\.sakuci\.id$ [NC]
    RewriteCond /www/wwwroot/cpanel.sakuci.id/projects/%1/public -d
    RewriteRule ^/(.*)$ /www/wwwroot/cpanel.sakuci.id/projects/%1/public/$1 [L]

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/tmp/php-cgi-82-ukk.sock|fcgi://localhost"
    </FilesMatch>

    <Directory "/www/wwwroot/cpanel.sakuci.id/projects">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /www/wwwlogs/barcode-wildcard-ssl-error.log
    CustomLog /www/wwwlogs/barcode-wildcard-ssl-access.log combined
</VirtualHost>
